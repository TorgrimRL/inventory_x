name: "Task"
description: "Technical/project task (often part of a user story)"
title: "Task: "
labels:
  - "type: task"

body:
  - type: textarea
    id: what
    attributes:
      label: "What to do"
      placeholder: "Describe the task in 1–3 sentences."
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: "Parent user story (optional)"
      placeholder: "#123"
    validations:
      required: false
