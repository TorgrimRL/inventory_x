name: "Bug"
description: "Report something that is broken"
title: "Bug: "
labels:
  - "type: bug"

body:
  - type: textarea
    id: summary
    attributes:
      label: "What happened?"
      placeholder: "Short description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      placeholder: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      placeholder: "What actually happened (error message, wrong output, etc.)."
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: "Context (optional)"
      placeholder: "page/endpoint, branch/commit, browser, logs, etc."
    validations:
      required: false
