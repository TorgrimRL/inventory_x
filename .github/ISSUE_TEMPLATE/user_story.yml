name: "User Story (Draft)"
description: "Backlog user story. Add specification-by-example before sprint."
title: "US: "
labels:
  - "type: user story"
  - "needs-spec"

body:
  - type: markdown
    attributes:
      value: |
        ### How we use this (INF-2900)
        - **User stories** should describe **visible value** to the user (avoid technical jargon).
        - Before moving a story to **Sprint / In Progress**, add **Specification by example** (Context → Action → Assertion).
        - Keep label **needs-spec** until examples are added.

  - type: input
    id: story
    attributes:
      label: "User story (Why / Who / What)"
      description: 'Use: "As a <role>, I can <action> so that <value>."'
      placeholder: "As a business owner, I can create an account so that I can access InventoryX securely."
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Notes / questions (for refinement)"
      description: "Anything unclear? Any assumptions?"
      placeholder: |
        - What fields are required?
        - Any constraints or edge cases?
    validations:
      required: false

  - type: checkboxes
    id: invest
    attributes:
      label: "INVEST quick check (before sprint)"
      options:
        - label: "Independent (not blocked by another story)"
        - label: "Valuable (visible value to the user)"
        - label: "Estimable (we understand enough)"
        - label: "Small (fits in a sprint)"
        - label: "Testable (we can specify examples)"

  - type: textarea
    id: spec_examples
    attributes:
      label: "Specification by example (add before sprint)"
      description: "Add 1–3 happy + exceptional cases (and edge cases if relevant)."
      placeholder: |
        Example: <Short, descriptive title> (happy case)
        Context:
        - ...
        Action:
        - ...
        Assertion:
        - ...

        Example: <Short, descriptive title> (exceptional case)
        Context:
        - ...
        Action:
        - ...
        Assertion:
        - ...
    validations:
      required: false

  - type: checkboxes
    id: sprint_ready
    attributes:
      label: "Sprint-ready gate (team rule)"
      options:
        - label: "At least one specification-by-example case is written"
        - label: "Story has an estimate (if we estimate stories)"
        - label: "needs-spec label removed before moving to Sprint/In Progress"
