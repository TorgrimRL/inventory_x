name: Prod-like smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run prod-like smoke test
        env:
          COMPOSE_FILE: deploy/docker-compose.prod.test.yml
          PROJECT_NAME: inventoryx-smoke
          BASE_URL: http://localhost:8081
          TEARDOWN: 1
        run: |
          chmod +x scripts/prod_smoke.sh
          ./scripts/prod_smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-artifacts
          path: .smoke-artifacts
          if-no-files-found: ignore