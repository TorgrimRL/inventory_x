name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Prettier (bruker pinned prettier fra frontend)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (for prettier)
        run: npm ci
        working-directory: frontend

      - name: Prettier check (backend markdown)
        run: npm exec --prefix frontend -- prettier --check "backend/**/*.md"

      # Python (uv + checks)
      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install backend deps
        run: uv sync --frozen
        working-directory: backend

      - name: Ruff format check
        run: uv run ruff format --check .
        working-directory: backend

      - name: Ruff lint
        run: uv run ruff check .
        working-directory: backend

      - name: Type check
        run: uv run mypy . --exclude 'migrations/'
        working-directory: backend

      - name: Tests
        run: uv run pytest -v -x
        working-directory: backend
