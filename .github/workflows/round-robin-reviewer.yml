name: Round-robin PR reviewer

on:
  pull_request:
    types: [ opened, reopened, ready_for_review, synchronize ]

concurrency:
  group: round-robin-reviewer
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Select next reviewer and request review
        uses: actions/github-script@v7
        with:
          script: |
            const reviewers = [
              "TorgrimRL",
              "N-Choo",
              "Daniel-De-Dev",
              "Vargren11",
              "lottehenriksen",
              "Ann-Hilde"
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Pull request number we are working with
            const prNumber = context.payload.pull_request.number;

            // Label that locks the PR so synchronize events do not reassign it
            const assignedLabel = "rr-assigned";

            // Issue used to store the pointer for the next reviewer in the rotation
            const stateIssueTitle = "reviewer-rotation-state";

            // Fetch the full PR from the API because the payload can be incomplete or outdated
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            // Do not auto-assign draft PRs
            if (pr.draft) {
              core.info("PR is a draft; skipping.");
              return;
            }

            // If the PR is already marked as rr-assigned, do not reassign on synchronize
            const alreadyAssigned = (pr.labels || []).some((l) => l.name === assignedLabel);
            if (alreadyAssigned) {
              core.info(`PR is already marked '${assignedLabel}'; skipping reassignment.`);
              return;
            }

            // If someone is already requested as a reviewer, do not override it
            if ((pr.requested_reviewers?.length ?? 0) > 0) {
              core.info("PR already has requested reviewers; skipping.");
              return;
            }

            const author = pr.user.login;

            // Extra safety:
            // If the PR has already received a review (Approved/Changes requested/Comment),
            // do not request a new reviewer on later synchronize events.
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const hasReview = reviews.some((r) => {
              const login = r.user?.login?.toLowerCase();
              return (
                login &&
                login !== author.toLowerCase() &&
                r.state !== "DISMISSED"
              );
            });

            if (hasReview) {
              core.info("PR already has at least one review; skipping reassignment.");
              return;
            }

            // Find or create the issue that stores the pointer
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${stateIssueTitle}"`,
            });

            let issueNumber, pointer = 0;

            if (search.data.items.length > 0) {
              const issue = search.data.items[0];
              issueNumber = issue.number;

              // Search results can have truncated bodies, so read the issue to be sure
              const full = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });

              const body = (full.data.body || "0").trim();
              const parsed = parseInt(body, 10);
              pointer = Number.isNaN(parsed) ? 0 : parsed;
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: stateIssueTitle,
                body: "0",
              });
              issueNumber = created.data.number;
              pointer = 0;
            }

            // Select the next reviewer in round-robin order, but skip the PR author
            let pickIndex = null;
            for (let i = 0; i < reviewers.length; i++) {
              const idx = (pointer + i) % reviewers.length;
              const candidate = reviewers[idx];
              if (candidate.toLowerCase() !== author.toLowerCase()) {
                pickIndex = idx;
                break;
              }
            }

            if (pickIndex === null) {
              core.info("Found no eligible reviewer (is everyone the author?).");
              return;
            }

            const chosen = reviewers[pickIndex];
            const nextPointer = (pickIndex + 1) % reviewers.length;

            // Request a review on the PR
            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number: prNumber,
              reviewers: [chosen],
            });

            // Mark the PR with rr-assigned so synchronize does not reassign it later
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [assignedLabel],
            });

            // Update the pointer in the state issue
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body: String(nextPointer),
            });

            core.info(`Requested review from ${chosen}. Next pointer: ${nextPointer}`);
