name: Build & Deploy

on:
  push:
    branches: [ "host-app", "175-task-configure-httpstls-for-production-deployment-on-inventoryxtdorguitno" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - ".dockerignore"
      - "LICENSE"
      - "deploy/certbot/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/torgrimrl/inventory_x
  TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend (django)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/django:${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}/django:latest

      - name: Build & push frontend (spa)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/spa:${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}/spa:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Validate SSH inputs (safe)
        run: |
          test -n "${{ secrets.SSH_HOST }}"
          test -n "${{ secrets.SSH_USER }}"
          test -n "${{ secrets.SSH_KEY }}"
          echo "SSH secrets are present"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          timeout: 60s
          command_timeout: 15m

          script: |
            set -euo pipefail
            cd /opt/myapp

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            export TAG=${{ env.TAG }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
