name: Frontend tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
    paths-ignore:
      - "frontend/README.md"
      - ".vscode/**"
      - "README.md"

  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
    paths-ignore:
      - "frontend/README.md"
      - ".vscode/**"
      - "README.md"

  workflow_dispatch:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --ci
