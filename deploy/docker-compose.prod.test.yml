services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
    volumes:
      - postgres_data_prodtest:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    image: inventory-backend-prod
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"

  spa:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    image: inventory-frontend-prod
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    depends_on:
      - web
      - spa
    ports:
      - "8081:80"
    volumes:
      - ./nginx.prod.test.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data_prodtest: