limit_req_zone $binary_remote_addr zone=login:10m    rate=5r/m;       # 5 requests per minute
limit_req_zone $binary_remote_addr zone=signup:10m   rate=2r/m;       # 1 request per minute (rundet opp fra 10r/h)
limit_req_zone $binary_remote_addr zone=pwreset:10m  rate=2r/m;       # 1 request per minute (rundet opp fra 3r/h)
limit_req_zone $binary_remote_addr zone=api:10m      rate=10r/s;      # 60 requests per minute
limit_req_status 429;
limit_req_log_level warn;
server {
    listen 80;
    server_name localhost 127.0.0.1;
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
    # 5 req/min, burst 3
    location = /api/user/login/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 2 req/min, burst 2
    location = /api/user/signup/ {
        limit_req zone=signup burst=2 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 2 req/min, burst 2
    location = /api/user/password_reset {
        limit_req zone=pwreset burst=2 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same endpoint with trailing slash, in case a client sends it.
    location = /api/user/password_reset/ {
        limit_req zone=pwreset burst=2 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 10 req/s, burst 30
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://spa:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
