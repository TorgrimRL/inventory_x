# HTTP: ACME challenge + redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name inventoryx.td.org.uit.no;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: main app
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name inventoryx.td.org.uit.no;

  ssl_certificate /etc/letsencrypt/live/inventoryx.td.org.uit.no/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/inventoryx.td.org.uit.no/privkey.pem;

  # Optional sane defaults (can be improved later)
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  # SPA (static, served by spa container)
  location / {
    proxy_pass http://spa:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Django API
  location /api/ {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Django admin
  location /admin/ {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}