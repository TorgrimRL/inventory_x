# Rate limiting zones (http context — included inside http {} by nginx)
# References:
#   OWASP Authentication Cheat Sheet:
#     https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
#   OWASP Forgot Password Cheat Sheet:
#     https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
#   OWASP API Security Top 10 2023 — API4: Unrestricted Resource Consumption:
#     https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/

# 10m shared memory zone (~160 000 unique IPs per zone)
limit_req_zone $binary_remote_addr zone=login:10m    rate=5r/m;       # 5 requests per minute
limit_req_zone $binary_remote_addr zone=signup:10m   rate=2r/m;       # 2 requests per minute
limit_req_zone $binary_remote_addr zone=pwreset:10m  rate=2r/m;       # 2 requests per minute
limit_req_zone $binary_remote_addr zone=api:10m      rate=10r/s;      # 10 requests per second
limit_req_status 429;
limit_req_log_level warn;

# HTTP: ACME challenge + redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name inventoryx.td.org.uit.no;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: main app
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name inventoryx.td.org.uit.no;

  ssl_certificate /etc/letsencrypt/live/inventoryx.td.org.uit.no/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/inventoryx.td.org.uit.no/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  # --- Auth endpoints: tight per-IP rate limits ---

  # 5 req/min, allow a burst of 3 before rejecting with 429
  location = /api/user/login/ {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # 2 req/min, allow a burst of 2 before rejecting with 429
  location = /api/user/signup/ {
    limit_req zone=signup burst=2 nodelay;
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  # 2 req/min, allow a burst of 2 before rejecting with 429
  location = /api/user/password_reset {
    limit_req zone=pwreset burst=2 nodelay;
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Same endpoint with trailing slash, in case a client sends it.
  location = /api/user/password_reset/ {
    limit_req zone=pwreset burst=2 nodelay;
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # --- General API: broad rate limit ---

  # 10 req/s, allow bursts up to 30 before rejecting with 429
  location /api/ {
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Django admin
  location /admin/ {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # SPA (static, served by spa container)
  location / {
    proxy_pass http://spa:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /static/ {
    alias /app/static/;
  }

  location /media/ {
    alias /app/media/;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
