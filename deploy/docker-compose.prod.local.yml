services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - ../:/repo
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    expose:
      - "5173"

  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  backend_venv:
